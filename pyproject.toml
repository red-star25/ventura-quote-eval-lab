[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quote-eval"
version = "0.2.4"
description = "Evaluation harness for synthetic and live quoting decisions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
quote-eval = "quote_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
